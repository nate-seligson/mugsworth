      button, select {

      select {

       -moz-appearance: none;

     /* Some firefox range styling */
     input[type=range] {
      -moz-appearance: none;
     }

      background-color: #fff;
      height: 1rem;
      width: .5rem;
      border-color: #fff;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.5);

      background-color: #fff;

      .speecharg {
        height: 2rem;
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: space-between;
        justify-content: space-between;
        align-items: center;
        -webkit-align-items: center;
      }
      .speecharg label {
        display: inline-block;
        width: 20%;
      }
      .speecharg input, .speecharg select {
        display: inline-block;
        width: calc(80% - 3rem);
        margin: 0;
      }
      .speecharg button {
        width: 1.5rem;
        height: 1.5rem;
        margin: 0 0 0 1.5rem;
        display: inline-block;
        padding: 0;
      }
      .bottom {
        margin-top: 1rem;
        margin: 1rem 0;
        display: -webkit-flex;
        display: flex;
        justify-content: space-between;
        -webkit-justify-content: space-between;
      }
      .bottom > * {
      }

      .bottom button.small {
        height: 3.25rem;
        width: 3.25rem;
        padding: 0;
      }

      #textarea {
         width: 100%;
         height: 8rem;
         display: block;
         margin-bottom: 1rem;
         border-radius: 5px;
         position: relative;
         background-color: #fff;
         transition: background-color 100ms ease;
         -webkit-transition: background-color 100ms ease;
       }

       .speaking #textarea {
        background-color: #333;
       }

      #textarea > * {
        position: absolute;
        display: block;
        border: none;
        resize: none;
        top: 0;
        left: 0;
        width: calc(100% - 1rem);
        height: calc(100% - 1rem);
        margin: .5rem;
        padding: 0;
        white-space: pre-wrap;
        line-height: 1.1rem;
        background-color: transparent;
        font-size: 12px;
        font-family: monospace;
      }

      #textbeingspoken {
        color: #aaa;
        visibility: hidden;
        opacity: 0;
        overflow: auto;
        transition: all 100ms ease;
        -webkit-transition: all 100ms ease;
       }

       .speaking #textbeingspoken {
        visibility: visible;
        opacity: 1;
       }

      a#gh {
        color: #333;
        text-align: right;
        display: block;
        font-style: italic;
      }

      #marker {
        position: absolute;
        visibility: hidden;
        border: 1px solid orange;
      }

      #marker.moved {
        visibility: visible;
      }

      #marker.animate {
        transition: all 50ms ease;
        -webkit-transition: all 50ms ease;
      }

      button > img {
        width: 100%;
        height: auto;
      }

      .widebutton {
        width: 9rem;
      }

      .widebutton > button {
        display: block;
        margin-bottom: 0.25rem;
        width: 100%;
      }

    </style>
    <script>

  function resetPitch() {
    document.getElementById('pitch').value = 0.5;
  }

  function resetRate() {
    document.getElementById('rate').value = 0;
  }

  function resetVolume() {
    document.getElementById('volume').value = 1;
  }

  function resetVoice() {
    document.getElementById('default-voice').selected = true;
  }
    </script>

    <h1>Web Speech Synthesis Demo</h1>
    <form>
      <div id="textarea">
        <textarea id="texttospeak">Call me Ishmael. Some years ago—never mind how long precisely—having little or no money in my purse, and nothing particular to interest me on shore, I thought I would sail about a little and see the watery part of the world.</textarea>

><option value="Yelda">Yelda (tr-TR)</option><option value="Yuna">Yuna (ko-KR)</option><option value="Yuri">Yuri (ru-RU)</option><option value="Zosia">Zosia (pl-PL)</option><option value="Zuzana">Zuzana (cs-CZ)</option><option value="Google Deutsch">Google Deutsch (de-DE)</option><option value="Google US English">Google US English (en-US)</option><option value="Google UK English Female">Google UK English Female (en-GB)</option><option value="Google UK English Male">Google UK English Male (en-GB)</option><option value="Google español">Google español (es-ES)</option><option value="Google español de Estados Unidos">Google español de Estados Unidos (es-US)</option><option value="Google français">Google français (fr-FR)</option><option value="Google हिन्दी">Google हिन्दी (hi-IN)</option><option value="Google Bahasa Indonesia">Google Bahasa Indonesia (id-ID)</option><option value="Google italiano">Google italiano (it-IT)</option><option value="Google 日本語">Google 日本語 (ja-JP)</option><option value="Google 한국의">Google 한국의 (ko-KR)</option><option value="Google Nederlands">Google Nederlands (nl-NL)</option><option value="Google polski">Google polski (pl-PL)</option><option value="Google português do Brasil">Google português do Brasil (pt-BR)</option><option value="Google русский">Google русский (ru-RU)</option><option value="Google&nbsp;普通话（中国大陆）">Google&nbsp;普通话（中国大陆） (zh-CN)</option><option value="Google&nbsp;粤語（香港）">Google&nbsp;粤語（香港） (zh-HK)</option><option value="Google 國語（臺灣）">Google 國語（臺灣） (zh-TW)</option></select><button type="button" aria-label="Reset voice" title="Reset voice" onclick="resetVoice();">↶</button>
      </div>
      <div class="bottom">
        <div class="widebutton">
          <button type="button" onmousedown="speak();"><strong>Speak it</strong></button>
          <button type="button" id="preachit" onmousedown="stop(); speak();">Interrupt</button>
        </div>
        <button type="button" class="small" aria-label="Pause/Resume" title="Pause/Resume" onmousedown="playpause();"><img src="play_pause.svg"></button>
        <button type="button" class="small" aria-label="Cancel" title="Cancel" onmousedown="stop();"><img src="stop.svg"></button>
      </div>
      <div class="bottom">
      </div>
    </form>
    <div id="marker" class="" style="top: 100px; left: 595.367px; width: 8.22656px; height: 15px;"></div>
      <script type="text/javascript">
        var texttospeak = document.getElementById('texttospeak');
        var textbeingspoken = document.getElementById('textbeingspoken');
        var marker = document.getElementById('marker');
        var range = document.createRange();
        var speechtext;
        var firstBoundary;

        var voices = [];
        function populateVoiceList() {
          voices = window.speechSynthesis.getVoices();
          var selectElm = document.querySelector('#voice');
          selectElm.innerHTML = '';
          for (var i=0;i < voices.length;i++) {
            var option = document.createElement('option');
            option.innerHTML = voices[i].name + ' (' + voices[i].lang + ')';
            option.setAttribute('value', voices[i].voiceURI);
            option.voice = voices[i];
            if (voices[i].default)
              option.selected = true;
            selectElm.appendChild(option);
          }
        }

        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined)
          speechSynthesis.onvoiceschanged = populateVoiceList;

        function stop() {
          speechSynthesis.cancel();
        }

        function speak() {
          speechtext = texttospeak.value;
          firstBoundary = true;
          textbeingspoken.textContent = speechtext;

          utterance = new SpeechSynthesisUtterance(
            document.getElementById('texttospeak').value);
            console.log(document.getElementById('voice').selectedIndex)
          utterance.voice = voices[document.getElementById('voice').selectedIndex];
          utterance.volume = document.getElementById('volume').value;
          utterance.pitch = document.getElementById('pitch').value;
          var rate = document.getElementById('rate').value;
          utterance.rate = Math.pow(Math.abs(rate) + 1, rate < 0 ? -1 : 1);
          speechSynthesis.speak(utterance);
        }

      </script>
